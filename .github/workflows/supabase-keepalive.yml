# Keeps the free-tier Supabase project from auto-pausing (it pauses after ~7 days with no
# database activity, which takes sign-up/log-in down). Runs a zero-row query every 3 days.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL  = https://<project>.supabase.co
#   SUPABASE_KEY  = the anon (public) key — NOT the service-role key
#
# Notes:
# - Scheduled workflows only run from the default branch (main).
# - GitHub disables schedules in public repos after 60 days without commits; it emails a
#   warning first, and re-enabling is one click on the Actions tab.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"   # 09:17 UTC every 3rd day
  workflow_dispatch:          # "Run workflow" button for a manual test

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database (zero rows) and check auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_KEY repository secrets"; exit 1
          fi
          # limit=0 runs a real Postgres query (counts as activity) but returns no data.
          db=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/user_profiles?select=username&limit=0")
          auth=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            -H "apikey: ${SUPABASE_KEY}" "${SUPABASE_URL}/auth/v1/health")
          echo "database: HTTP ${db} · auth: HTTP ${auth}"
          if [ "${db}" != "200" ] || [ "${auth}" != "200" ]; then
            echo "::error::Supabase did not answer 200 — the project may be paused. Restore it in the dashboard."
            exit 1
          fi
